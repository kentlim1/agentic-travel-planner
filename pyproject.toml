[project]
name = "travel-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph==0.6.11",
    "langchain-core==0.3.83",
    "langchain-huggingface==0.1.2",
    "chromadb==1.5.5",
    "sentence-transformers==3.0.1",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "langchain-aws==0.2.35",
    "boto3==1.42.93",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "travel_db"]

[tool.ruff.lint]
# Correctness-only: undefined names, unused imports/vars, syntax errors.
# Deliberately not enforcing style (line-length, import order) to avoid
# churn on the existing long LLM prompt strings.
select = ["E9", "F"]
